          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/admin/groups/{id}:
    put:
      tags: [管理]
      summary: 更新使用者群組
      description: >-
        取代群組可變欄位。`name` 必填；其餘省略的欄位維持原值，配額設為 `null` 表示跟隨全站，
        `description: null` 會清除說明，`domain_ids: null` 或 `[]` 會清空允許清單，
        `is_default: true` 會轉移唯一的預設標記。
      operationId: updateAdminGroup
      parameters:
        - name: id
          in: path
          required: true
          description: 群組的數值 id。
          schema:
            type: integer
            format: int64
            example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/GroupPayload'
      responses:
        '200':
          description: 更新後的群組。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/GroupDto'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
    delete:
      tags: [管理]
      summary: 刪除使用者群組
      description: >-
        先把成員移到 `reassign_to` 再刪除群組。預設群組不可刪除，目標不存在或不合法時回
        `409`；請先以 `PUT` 轉移標記。
      operationId: deleteAdminGroup
      parameters:
        - name: id
          in: path
          required: true
          description: 群組的數值 id。
          schema:
            type: integer
            format: int64
            example: 2
        - name: reassign_to
          in: query
          required: false
          description: 接收被刪除群組成員的群組 id。
          schema:
            type: integer
            format: int64
            example: 3
      responses:
        '204':
          description: 群組成員已移動，群組已刪除。
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '409':
          $ref: 'components.yaml#/responses/Conflict'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

