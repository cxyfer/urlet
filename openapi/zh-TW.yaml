# urlet OpenAPI 3.1 —— 繁體中文文案與路徑結構。
#
# 本檔只承載繁體中文的說明文字與 API 的形狀。所有 schema、共用回應與安全機制都定義在
# components.yaml，並以 'components.yaml#/schemas/Name' 或 'components.yaml#/responses/Name'
# 參照。兩個檔案本身都不是合法的 OpenAPI 文件：scripts/build-openapi.py 會把兩半合併成
# openapi/dist/ 下可獨立使用的文件，那些產物是衍生的，絕不可手動編輯。

openapi: 3.1.0
info:
  title: urlet JSON API 參考
  version: "__URLET_VERSION__"
  description: >-
    urlet 的 JSON API，這是一套自架的短網址服務。除了健康檢查、公開短網址工具與連結解鎖
    之外，其餘端點都位於 `/api/v1` 之下，並回應 `application/json; charset=utf-8`。時間
    一律為 ISO-8601 UTC，JSON 回應一律為英文，不受使用者選擇的介面語言影響。認證方式為
    `urlet_session` cookie 或 `Authorization: Bearer ur_...`。
servers:
  # API 只存在於 canonical 主機，但參考頁會在頁尾出現的每個主機上提供，因此合約
  # 無法寫死自己的來源。產生器會原樣保留這個 token，由執行檔在提供文件時換成
  # 設定的 base URL。
  - url: __URLET_BASE_URL__
    description: 提供本合約的執行個體。
tags:
  - name: 認證
    description: 帳號、Session、個人資料與密碼。
  - name: 短網址
    description: 建立、列出、更新與分析短網址。
  - name: 預覽
    description: 單一短網址的自訂 Open Graph 與 Twitter Card 中介資料。
  - name: 標籤
    description: 已認證帳號的標籤清單。
  - name: 邀請碼
    description: 成員為自己所屬群組發出的邀請碼。
  - name: 網域
    description: 呼叫者可建立連結的 active 網域。
  - name: API Token
    description: '以 `Authorization: Bearer ur_...` 傳送的個人 API Token。'
  - name: 公開端點
    description: 不需要憑證即可回應的端點。
  - name: 管理
    description: 需要 `role = admin` 的端點。
security:
  - sessionCookie: []
  - bearerToken: []
paths:
  /api/v1/auth/register:
    post:
      tags: [認證]
      summary: 註冊帳號
      description: >-
        建立帳號並同時登入，回應會設定 Session Cookie。`invite` 註冊模式下必須帶邀請碼；
        `open` 模式下為選填，但一旦提供就會驗證，且其群組優先於預設群組。只有在註冊流程
        啟用防機器人驗證時才會檢查驗證結果。
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/RegisterPayload'
      responses:
        '201':
          description: 帳號已建立並登入；回應同時設定 Session Cookie。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/UserEnvelope'
        '400':
          $ref: 'components.yaml#/responses/BadRequest'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '409':
          $ref: 'components.yaml#/responses/Conflict'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '429':
          $ref: 'components.yaml#/responses/RateLimited'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags: [認證]
      summary: 登入
      description: >-
        驗證帳密並設定 `urlet_session` cookie。帳密錯誤回固定的 `401` 訊息，不洩漏帳號是否
        存在；帳號停權回 `403`。連續失敗會鎖定帳號並回 `429`。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/LoginPayload'
      responses:
        '200':
          description: 已登入；回應同時設定 Session Cookie。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/UserEnvelope'
        '400':
          $ref: 'components.yaml#/responses/BadRequest'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '429':
          $ref: 'components.yaml#/responses/RateLimited'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [認證]
      summary: 登出
      description: >-
        撤銷當前 Session 並清除 Session Cookie。也可以匿名呼叫，此時只會清除 Cookie。
      operationId: logout
      # 這個呼叫可以匿名進行，因此不得繼承文件層級的 session-or-bearer 要求；
      # 否則用戶端會把它建模成需要憑證。
      security: []
      responses:
        '204':
          description: Session 已撤銷，Session Cookie 已清除。
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/auth/me:
    get:
      tags: [認證]
      summary: 取得目前帳號
      description: >-
        回傳使用者、所屬群組（或 `null`）與生效額度。`limits` 是解析後的值：群組配額非
        `NULL` 時才覆蓋全站值，`0` 表示無上限。
      operationId: getCurrentUser
      responses:
        '200':
          description: 目前帳號與適用於它的規則。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/MeDto'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
    patch:
      tags: [認證]
      summary: 更新目前帳號
      description: >-
        更新已認證帳號的個人資料。未出現的欄位、`null` 或空字串都會清除顯示名稱。
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/UpdateProfilePayload'
      responses:
        '200':
          description: 更新後的帳號。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/UserEnvelope'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/auth/password:
    post:
      tags: [認證]
      summary: 修改密碼
      description: >-
        修改已認證帳號的密碼。成功後會撤銷其他所有 Session，以及該帳號的所有 API Token；
        當前這個 Session 會保留。
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/ChangePasswordPayload'
      responses:
        '204':
          description: 密碼已變更；其他 Session 與所有 API Token 均已撤銷。
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '429':
          $ref: 'components.yaml#/responses/RateLimited'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/auth/sessions:
    get:
      tags: [認證]
      summary: 列出帳號的 Session
      description: >-
        列出該帳號的所有 Session，新到舊。Session 會滑動：每次活動都會把 `expires_at` 往後
        推並重新簽發 Cookie，因此持續使用不會過期。
      operationId: listSessions
      responses:
        '200':
          description: 該帳號的所有 Session。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/SessionList'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/auth/sessions/{id}:
    delete:
      tags: [認證]
      summary: 撤銷 Session
      description: >-
        撤銷已認證帳號的其中一個 Session。屬於他人的 Session 一律回 `404`，與不存在時相同。
      operationId: revokeSession
      parameters:
        - name: id
          in: path
          required: true
          description: 要撤銷的 Session 數值 id。
          schema:
            type: integer
            format: int64
            example: 12
      responses:
        '204':
          description: Session 已撤銷。
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/urls:
    get:
      tags: [短網址]
      summary: 列出短網址
      description: >-
        列出已認證帳號的短網址，新到舊，並套用下列篩選條件。`per_page` 預設 20，上限 100。
      operationId: listUrls
      parameters:
        - name: q
          in: query
          required: false
          description: 搜尋 slug、標題與目標網址；`%` 與 `_` 視為字面值。
          schema:
            type: string
            example: launch
        - name: tag
          in: query
          required: false
          description: 只回傳帶有此標籤名稱的連結。
          schema:
            type: string
            example: campaign
        - name: status
          in: query
          required: false
          description: 只回傳此儲存狀態的連結。
          schema:
            type: string
            enum: [active, disabled]
            example: active
        - name: sort
          in: query
          required: false
          description: >-
            排序方式。每個欄位也接受明確的方向後綴（`clicks_desc`、`slug_asc`、
            `updated_desc`、`expires_asc`）。其他任何值（包含 `created_at`）都會回退為
            最新優先。
          schema:
            type: string
            enum:
              - created_at
              - clicks
              - clicks_desc
              - slug
              - slug_asc
              - updated
              - updated_desc
              - expires
              - expires_asc
            default: created_at
            example: clicks
        - name: page
          in: query
          required: false
          description: 1 開始的頁碼。
          schema:
            type: integer
            format: int64
            minimum: 1
            default: 1
            example: 2
        - name: per_page
          in: query
          required: false
          description: 每頁筆數；預設 20，上限 100。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        '200':
          description: 一頁短網址。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/UrlPage'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
    post:
      tags: [短網址]
      summary: 建立短網址
      description: >-
        建立短網址。`target_url` 必填，且只接受 `http`/`https`。指定 `domain` 時必須是 active
        且符合群組策略；省略 `slug` 時會自動產生，且必須在選定網域上唯一。只有以 Session
        Cookie 呼叫、且建立流程啟用防機器人驗證時才會讀取 `captcha_token`；以 Bearer Token
        呼叫時會忽略。
      operationId: createUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/CreatePayload'
      responses:
        '201':
          description: 短網址已建立。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/UrlDto'
        '400':
          $ref: 'components.yaml#/responses/BadRequest'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '409':
          $ref: 'components.yaml#/responses/Conflict'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '429':
          $ref: 'components.yaml#/responses/RateLimited'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/urls/{id}:
    get:
      tags: [短網址]
      summary: 取得短網址
      description: >-
        回傳已認證帳號的其中一個短網址。屬於他人的連結一律回 `404`。
      operationId: getUrl
      parameters:
        - name: id
          in: path
          required: true
          description: 短網址的數值 id。
          schema:
            type: integer
            format: int64
            example: 42
      responses:
        '200':
          description: 該短網址。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/UrlDto'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
    patch:
      tags: [短網址]
      summary: 更新短網址
      description: >-
        部分更新：未出現的欄位維持不變，明確傳 `null` 表示清除。空物件回 `400`。把連結搬到
        另一個 active 網域時必須符合群組策略，並重新檢查該網域的 slug；維持目前網域一律允許。
      operationId: updateUrl
      parameters:
        - name: id
          in: path
          required: true
          description: 短網址的數值 id。
          schema:
            type: integer
            format: int64
            example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/UpdatePayload'
      responses:
        '200':
          description: 更新後的短網址。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/UrlDto'
        '400':
          $ref: 'components.yaml#/responses/BadRequest'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '409':
          $ref: 'components.yaml#/responses/Conflict'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
    delete:
      tags: [短網址]
      summary: 刪除短網址
      description: >-
        軟刪除。Slug 會保留不釋出，避免舊連結被劫持；統計資料也會保留。
      operationId: deleteUrl
      parameters:
        - name: id
          in: path
          required: true
          description: 短網址的數值 id。
          schema:
            type: integer
            format: int64
            example: 42
      responses:
        '204':
          description: 短網址已軟刪除。
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/urls/{id}/stats:
    get:
      tags: [短網址]
      summary: 取得短網址統計
      description: >-
        回傳單一連結的摘要、每日趨勢，以及來源、裝置、瀏覽器與作業系統的明細。`days` 限制在
        1–365（預設 30），`daily` 會補齊沒有點擊的日期。
      operationId: getUrlStats
      parameters:
        - name: id
          in: path
          required: true
          description: 短網址的數值 id。
          schema:
            type: integer
            format: int64
            example: 42
        - name: days
          in: query
          required: false
          description: 統計窗口的天數，介於 1 到 365。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 365
            default: 30
            example: 30
      responses:
        '200':
          description: 該短網址的統計資料。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/UrlStatsDto'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/urls/{id}/clicks:
    get:
      tags: [短網址]
      summary: 列出短網址的點擊
      description: >-
        回傳分頁的點擊明細，新到舊。明細刻意不含 IP 位址與 visitor 雜湊。
      operationId: listUrlClicks
      parameters:
        - name: id
          in: path
          required: true
          description: 短網址的數值 id。
          schema:
            type: integer
            format: int64
            example: 42
        - name: page
          in: query
          required: false
          description: 1 開始的頁碼。
          schema:
            type: integer
            format: int64
            minimum: 1
            default: 1
            example: 1
        - name: per_page
          in: query
          required: false
          description: 每頁筆數；預設 20，上限 100。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        '200':
          description: 一頁點擊明細。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/ClickList'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/urls/{id}/preview:
    get:
      tags: [預覽]
      summary: 取得短網址的預覽
      description: >-
        回傳單一連結的自訂 SNS 預覽中介資料。未設定時各欄位為 null、旗標為 false。屬於他人
        的連結一律回 `404`。
      operationId: getUrlPreview
      parameters:
        - name: id
          in: path
          required: true
          description: 短網址的數值 id。
          schema:
            type: integer
            format: int64
            example: 42
      responses:
        '200':
          description: 已儲存的預覽中介資料。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/PreviewDto'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
    patch:
      tags: [預覽]
      summary: 更新短網址的預覽
      description: >-
        省略的欄位維持不變；`null` 或空白字串則清除該欄位。設定或清除 `image_url` 會替換或
        移除已上傳的圖片。標題上限 200 字、內容上限 1000 字，圖片網址須為完整 HTTPS。
      operationId: updateUrlPreview
      parameters:
        - name: id
          in: path
          required: true
          description: 短網址的數值 id。
          schema:
            type: integer
            format: int64
            example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/Patch'
      responses:
        '200':
          description: 更新後的預覽中介資料。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/PreviewDto'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
    delete:
      tags: [預覽]
      summary: 刪除短網址的預覽
      description: 清除所有自訂預覽文字，並移除已上傳的圖片資料。
      operationId: deleteUrlPreview
      parameters:
        - name: id
          in: path
          required: true
          description: 短網址的數值 id。
          schema:
            type: integer
            format: int64
            example: 42
      responses:
        '204':
          description: 預覽已清除。
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/urls/{id}/preview/image:
    post:
      tags: [預覽]
      summary: 上傳短網址的預覽圖片
      description: >-
        替換預覽圖片並保留文字。上傳支援 PNG、JPEG、GIF、WebP，上限 2 MiB、4096 x 4096
        像素；MIME 依驗證後的位元組判定。實例停用上傳時回 `403`，上傳另套用每帳號速率限制。
      operationId: uploadUrlPreviewImage
      parameters:
        - name: id
          in: path
          required: true
          description: 短網址的數值 id。
          schema:
            type: integer
            format: int64
            example: 42
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: 要儲存為預覽圖片的檔案。
              required: [image]
      responses:
        '200':
          description: 帶有新圖片的預覽中介資料。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/PreviewDto'
        '400':
          $ref: 'components.yaml#/responses/BadRequest'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '429':
          $ref: 'components.yaml#/responses/RateLimited'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/domains:
    get:
      tags: [網域]
      summary: 列出可選網域
      description: >-
        列出建立新連結時可選的 active 網域，已依呼叫者所屬群組策略過濾。`is_default` 標記
        生效的群組預設網域。
      operationId: listDomains
      responses:
        '200':
          description: 可選的網域。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'components.yaml#/schemas/DomainChoiceDto'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/invites:
    get:
      tags: [邀請碼]
      summary: 列出帳號的邀請碼
      description: >-
        回傳呼叫者自己的邀請碼（新到舊），包含可顯示的邀請碼與註冊連結，以及生效配額。成員
        發碼另有節流：每個帳號每小時最多 20 個。
      operationId: listInvites
      parameters:
        - name: page
          in: query
          required: false
          description: 1 開始的頁碼。
          schema:
            type: integer
            format: int64
            minimum: 1
            default: 1
            example: 1
        - name: per_page
          in: query
          required: false
          description: 每頁筆數；預設 20，上限 100。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        '200':
          description: 帳號的邀請碼與其配額。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/MemberInviteList'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
    post:
      tags: [邀請碼]
      summary: 建立邀請碼
      description: >-
        為呼叫者所屬群組發出邀請碼。群組必須開啟 `allow_invites`，且其日曆配額同樣適用；
        `max_uses` 必須介於 1 到 10。超過每小時爆量上限時回 `429`。
      operationId: createInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/CreateMemberInvitePayload'
      responses:
        '201':
          description: 邀請碼已建立。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/CreatedMemberInvite'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '429':
          $ref: 'components.yaml#/responses/RateLimited'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/invites/{id}:
    delete:
      tags: [邀請碼]
      summary: 撤銷邀請碼
      description: >-
        撤銷呼叫者自己的其中一個邀請碼。他人的邀請碼一律回 `404`。撤銷從未被兌換的邀請碼會
        退回配額；已被兌換的邀請碼則維持計入。
      operationId: revokeInvite
      parameters:
        - name: id
          in: path
          required: true
          description: 邀請碼的數值 id。
          schema:
            type: integer
            format: int64
            example: 4
      responses:
        '204':
          description: 邀請碼已撤銷。
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/tags:
    get:
      tags: [標籤]
      summary: 列出標籤
      description: 列出已認證帳號的所有標籤；此清單不分頁。
      operationId: listTags
      responses:
        '200':
          description: 該帳號的標籤。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/TagList'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/tags/{id}:
    delete:
      tags: [標籤]
      summary: 刪除標籤
      description: >-
        刪除標籤。它只會解除標籤與短網址的關聯，短網址本身不受影響。
      operationId: deleteTag
      parameters:
        - name: id
          in: path
          required: true
          description: 標籤的數值 id。
          schema:
            type: integer
            format: int64
            example: 4
      responses:
        '204':
          description: 標籤已刪除。
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/public/urls:
    post:
      tags: [公開端點]
      summary: 免帳號建立短網址
      description: >-
        公開短網址工具的 JSON 版本，供指令稿使用。當 `public_create_access` 為 `guest` 時
        不需要任何憑證；也可改帶 Session cookie 或 Bearer Token，此時連結由該帳號擁有。匿名
        請求還必須命中已啟用的訪客目標白名單。刻意不回傳連結 id。
      operationId: createPublicUrl
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/PublicCreatePayload'
      responses:
        '201':
          description: 短網址已建立。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/PublicCreatedDto'
        '400':
          $ref: 'components.yaml#/responses/BadRequest'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '409':
          $ref: 'components.yaml#/responses/Conflict'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '429':
          $ref: 'components.yaml#/responses/RateLimited'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/public/urls/{slug}:
    get:
      tags: [公開端點]
      summary: 取得短網址的公開中介資料
      description: >-
        回傳不含目標網址的公開中介資料。省略 `domain` 時使用預設網域，讓多網域之前既有的
        呼叫對預設網域上的連結仍然有效。
      operationId: getPublicUrl
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: 短網址的 slug。
          schema:
            type: string
            example: promo
        - name: domain
          in: query
          required: false
          description: 連結所在網域的 hostname；省略時使用預設網域。
          schema:
            type: string
            example: go.example.com
      responses:
        '200':
          description: 該連結的公開中介資料。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/PublicUrlDto'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/tokens:
    get:
      tags: [API Token]
      summary: 列出 API Token
      description: 列出該帳號的所有 API Token；此清單不分頁。
      operationId: listTokens
      responses:
        '200':
          description: 該帳號的 API Token。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/TokenList'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
    post:
      tags: [API Token]
      summary: 建立 API Token
      description: >-
        建立個人 API Token，並只在此次回應中回傳明文值。群組關閉 API Token
        （`allow_api_tokens`）或生效的 `max_api_tokens` 用盡時回 `403`；配額只計算可用
        Token。
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/CreateTokenPayload'
      responses:
        '201':
          description: Token 已建立；明文值只在此回應中出現一次。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/CreatedTokenResponse'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/tokens/{id}:
    delete:
      tags: [API Token]
      summary: 撤銷 API Token
      description: >-
        撤銷該帳號的其中一個 Token，會立即釋出配額名額。其他帳號的 Token 一律回 `404`。
      operationId: revokeToken
      parameters:
        - name: id
          in: path
          required: true
          description: API Token 的數值 id。
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: Token 已撤銷。
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/admin/domains:
    get:
      tags: [管理]
      summary: 列出所有網域
      description: >-
        列出實例的所有網域，含連結數、狀態、來源，以及目前允許哪些操作的行政旗標。
      operationId: listAdminDomains
      responses:
        '200':
          description: 實例的所有網域。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'components.yaml#/schemas/AdminDomainDto'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
    post:
      tags: [管理]
      summary: 建立網域
      description: >-
        新增網域，建立時狀態為 `pending`。hostname 重複時回 `409`。
      operationId: createAdminDomain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/CreateDomainPayload'
      responses:
        '201':
          description: 網域已建立為 `pending`。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/AdminDomainDto'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '409':
          $ref: 'components.yaml#/responses/Conflict'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/admin/domains/{id}:
    patch:
      tags: [管理]
      summary: 更新網域
      description: >-
        啟用、停用或設為預設網域。同一個請求不能同時停用並設為預設，也不能透過此呼叫清除
        預設標記。
      operationId: updateAdminDomain
      parameters:
        - name: id
          in: path
          required: true
          description: 網域的數值 id。
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/UpdateDomainPayload'
      responses:
        '200':
          description: 更新後的網域。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/AdminDomainDto'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
    delete:
      tags: [管理]
      summary: 刪除網域
      description: >-
        刪除網域。僅限沒有連結、非預設的 `ui` 網域；其他情況回 `409`。
      operationId: deleteAdminDomain
      parameters:
        - name: id
          in: path
          required: true
          description: 網域的數值 id。
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: 網域已刪除。
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '409':
          $ref: 'components.yaml#/responses/Conflict'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/admin/users:
    get:
      tags: [管理]
      summary: 列出使用者
      description: >-
        列出實例的帳號，含連結數、群組 id 與群組名稱。`per_page` 預設 20，上限 100。
      operationId: listAdminUsers
      parameters:
        - name: q
          in: query
          required: false
          description: 搜尋 email 與顯示名稱。
          schema:
            type: string
            example: ada
        - name: role
          in: query
          required: false
          description: 只回傳此角色的帳號。
          schema:
            type: string
            enum: [user, admin]
            example: admin
        - name: status
          in: query
          required: false
          description: 只回傳此狀態的帳號。
          schema:
            type: string
            enum: [active, suspended]
            example: active
        - name: group_id
          in: query
          required: false
          description: 只回傳屬於此群組的帳號。
          schema:
            type: integer
            format: int64
            example: 2
        - name: page
          in: query
          required: false
          description: 1 開始的頁碼。
          schema:
            type: integer
            format: int64
            minimum: 1
            default: 1
            example: 1
        - name: per_page
          in: query
          required: false
          description: 每頁筆數；預設 20，上限 100。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        '200':
          description: 一頁使用者資料。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/AdminUserPage'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/admin/users/{id}:
    patch:
      tags: [管理]
      summary: 更新使用者
      description: >-
        變更帳號的角色、狀態、顯示名稱或群組；`group_id: null` 表示改為未分組。管理員不能
        變更自己的角色或狀態，且系統永遠保留至少一位有效管理員。
      operationId: updateAdminUser
      parameters:
        - name: id
          in: path
          required: true
          description: 帳號的數值 id。
          schema:
            type: integer
            format: int64
            example: 7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/UpdateUserPayload'
      responses:
        '200':
          description: 更新後的帳號。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/UserDto'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '409':
          $ref: 'components.yaml#/responses/Conflict'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
    delete:
      tags: [管理]
      summary: 刪除使用者
      description: >-
        軟刪除該帳號與其所有短網址。管理員不能刪除自己，且系統永遠保留至少一位有效管理員。
      operationId: deleteAdminUser
      parameters:
        - name: id
          in: path
          required: true
          description: 帳號的數值 id。
          schema:
            type: integer
            format: int64
            example: 7
      responses:
        '204':
          description: 帳號與其短網址已軟刪除。
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '409':
          $ref: 'components.yaml#/responses/Conflict'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/admin/users/{id}/password:
    post:
      tags: [管理]
      summary: 重設使用者密碼
      description: >-
        為帳號設定新密碼，並撤銷該帳號的所有 Session。新密碼必須符合實例的密碼政策。
      operationId: resetAdminUserPassword
      parameters:
        - name: id
          in: path
          required: true
          description: 帳號的數值 id。
          schema:
            type: integer
            format: int64
            example: 7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/ResetPasswordPayload'
      responses:
        '204':
          description: 密碼已重設；該帳號的所有 Session 均已撤銷。
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '422':
          $ref: 'components.yaml#/responses/ValidationError'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/admin/urls:
    get:
      tags: [管理]
      summary: 列出所有短網址
      description: >-
        列出全站短網址，並套用下列篩選條件。`per_page` 預設 20，上限 100。
      operationId: listAdminUrls
      parameters:
        - name: q
          in: query
          required: false
          description: 搜尋 slug、標題與目標網址。
          schema:
            type: string
            example: launch
        - name: status
          in: query
          required: false
          description: 只回傳此儲存狀態的連結。
          schema:
            type: string
            enum: [active, disabled]
            example: active
        - name: user_id
          in: query
          required: false
          description: 只回傳此帳號擁有的連結。
          schema:
            type: integer
            format: int64
            example: 7
        - name: sort
          in: query
          required: false
          description: >-
            排序方式。每個欄位也接受明確的方向後綴（`clicks_desc`、`slug_asc`、
            `updated_desc`、`expires_asc`）。其他任何值（包含 `created_at`）都會回退為
            最新優先。
          schema:
            type: string
            enum:
              - created_at
              - clicks
              - clicks_desc
              - slug
              - slug_asc
              - updated
              - updated_desc
              - expires
              - expires_asc
            default: created_at
            example: clicks
        - name: page
          in: query
          required: false
          description: 1 開始的頁碼。
          schema:
            type: integer
            format: int64
            minimum: 1
            default: 1
            example: 1
        - name: per_page
          in: query
          required: false
          description: 每頁筆數；預設 20，上限 100。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        '200':
          description: 一頁短網址。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/UrlPage'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '500':
          $ref: 'components.yaml#/responses/InternalError'

  /api/v1/admin/urls/{id}:
    patch:
      tags: [管理]
      summary: 更新短網址
      description: 變更任一短網址的儲存狀態或轉址狀態碼。
      operationId: updateAdminUrl
      parameters:
        - name: id
          in: path
          required: true
          description: 短網址的數值 id。
          schema:
            type: integer
            format: int64
            example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/UpdateUrlPayload'
      responses:
        '200':
          description: 更新後的短網址。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/UrlDto'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
