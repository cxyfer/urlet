  /{slug}/unlock:
    post:
      tags: [公開端點]
      summary: 解鎖受密碼保護的短網址
      description: >-
        接受 `application/json` 或 `application/x-www-form-urlencoded`。JSON 請求成功時回
        `200` 與下一步路徑，並設定解鎖 Cookie；表單請求則以 `303` 轉往 `/{slug}`。密碼通過
        前永不揭露目的地，連續失敗會受速率限制。
      operationId: unlockLink
      security: []
      # 連結可能位於額外的短網域，而這個端點是透過請求自己的 host 解析 slug。
      # 文件層級的 server 指向 canonical API 主機，會解鎖到別的連結或回 404，
      # 因此這個操作改為指名連結自己所屬的網域。
      servers:
        # 每個已啟用的網域都提供這個端點，而 slug 是在請求抵達的網域上解析的。
        # 相對網址仍會解析到提供本文件的 canonical 主機，那會解鎖到別的連結或回
        # 404，因此來源改用呼叫端替換的變數。預設值是 canonical 主機，對位於該處
        # 的連結是正確的。
        - url: '{origin}'
          description: >-
            短網址的來源。請使用建立該連結時所用的來源，可由 `GET /api/v1/domains`
            取得；位於額外短網域的連結要在該網域解鎖，而非 canonical API 主機。
          variables:
            origin:
              default: __URLET_BASE_URL__
              description: 短網址的來源，含 scheme。
      parameters:
        - name: slug
          in: path
          required: true
          description: 受密碼保護短網址的 slug。
          schema:
            type: string
            example: promo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components.yaml#/schemas/UnlockPayload'
          application/x-www-form-urlencoded:
            schema:
              $ref: 'components.yaml#/schemas/UnlockPayload'
      responses:
        '200':
          description: 密碼正確；此回應會設定解鎖 Cookie。
          content:
            application/json:
              schema:
                $ref: 'components.yaml#/schemas/UnlockResponse'
        '303':
          description: 表單請求成功；回應轉往 `/{slug}` 並設定解鎖 Cookie。
          headers:
            Location:
              description: 已解鎖連結的同站路徑。
              schema:
                type: string
                example: /promo
        '400':
          $ref: 'components.yaml#/responses/BadRequest'
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '404':
          $ref: 'components.yaml#/responses/NotFound'
        '410':
          $ref: 'components.yaml#/responses/Gone'
        '429':
          $ref: 'components.yaml#/responses/RateLimited'
        '500':
          $ref: 'components.yaml#/responses/InternalError'
