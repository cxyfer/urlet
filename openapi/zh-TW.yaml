                  uptime_seconds:
                    type: integer
                    format: int64
                    description: 行程啟動後經過的秒數。
                    example: 42
                  users:
                    type: integer
                    format: int64
                    description: 帳號數量。
                    example: 120
                  admins:
                    type: integer
                    format: int64
                    description: 具 `admin` 角色的帳號數量。
                    example: 2
                  links:
                    type: integer
                    format: int64
                    description: 短網址數量。
                    example: 4210
                  total_clicks:
                    type: integer
                    format: int64
                    description: 所有已記錄的點擊，含自動化流量。
                    example: 91234
                  unique_clicks:
                    type: integer
                    format: int64
                    description: 不重複訪客的點擊數。
                    example: 71234
                  bot_clicks:
                    type: integer
                    format: int64
                    description: 判定為自動化流量的點擊數。
                    example: 20000
                  expired_links:
                    type: integer
                    format: int64
                    description: 已過期或達點擊上限的連結數。
                    example: 310
                  active_invites:
                    type: integer
                    format: int64
                    description: 仍可兌換的邀請碼數量。
                    example: 12
                  active_tokens:
                    type: integer
                    format: int64
                    description: 仍可通過認證的 API Token 數量。
                    example: 34
                  database_bytes:
                    type: [integer, 'null']
                    format: int64
                    description: SQLite 資料庫大小（bytes），未知時為 `null`。
                    example: 10485760
                  registration_mode:
                    type: string
                    description: 實例目前生效的註冊模式。
                    example: invite
                required:
                  - version
                  - uptime_seconds
                  - users
                  - admins
                  - links
                  - total_clicks
                  - unique_clicks
                  - bot_clicks
                  - expired_links
                  - active_invites
                  - active_tokens
                  - database_bytes
                  - registration_mode
        '401':
          $ref: 'components.yaml#/responses/Unauthorized'
        '403':
          $ref: 'components.yaml#/responses/Forbidden'
        '500':
