# urlet — optional TLS overlay.
#
# Adds Caddy in front of the app so certificates are obtained and renewed
# automatically. Requires a public DNS record pointing at this host and
# Docker Compose >= 2.24 (for the `!override` tag).
#
#   export URLET_DOMAIN=s.example.com
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build

name: urlet

services:
  urlet:
    # Not published directly any more: Caddy proxies it over the compose network.
    ports: !override []
    environment:
      URLET_BASE_URL: https://${URLET_DOMAIN:?set URLET_DOMAIN}
      URLET_SECURE_COOKIES: "true"
      URLET_TRUST_PROXY: "true"

  caddy:
    image: caddy:2-alpine
    container_name: urlet-caddy
    restart: unless-stopped
    depends_on:
      urlet:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      URLET_DOMAIN: ${URLET_DOMAIN:?set URLET_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
    name: urlet-caddy-data
  caddy-config:
    name: urlet-caddy-config
