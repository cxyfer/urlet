[package]
name = "uwurls"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Lightweight multi-user URL shortener with password protection and expiry"
license = "MIT"
default-run = "uwurls"

[lib]
name = "uwurls"
path = "src/lib.rs"

[[bin]]
name = "uwurls"
path = "src/main.rs"

[dependencies]
# HTTP
axum = { version = "0.8", default-features = false, features = ["http1", "json", "form", "query", "tokio", "matched-path", "original-uri"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }

# Templates / serialization
askama = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Security primitives
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
base64 = "0.22"
rand = "0.8"

# Time / misc
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
