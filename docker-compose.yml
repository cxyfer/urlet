# urlet — single container deployment (SQLite, no external services).
#
#   cp .env.example .env   # then edit it
#   docker compose up -d --build
#
# Optional TLS overlay (Caddy + automatic HTTPS):
#   URLET_DOMAIN=s.example.com docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build

name: urlet

services:
  urlet:
    build:
      context: .
      dockerfile: Dockerfile
    image: urlet:1.3.0-rc.1
    container_name: urlet
    restart: unless-stopped

    ports:
      # Host port is configurable; the container always listens on 8080.
      - "${URLET_PORT:-8080}:8080"

    environment:
      URLET_BIND: 0.0.0.0:8080
      URLET_BASE_URL: ${URLET_BASE_URL:-http://localhost:8080}
      # Extra redirect-only hostnames, comma separated (inserted on first boot).
      URLET_DOMAINS: ${URLET_DOMAINS:-}
      URLET_DATABASE_URL: "sqlite:///data/urlet.db?mode=rwc"
      URLET_DATA_DIR: /data
      # Leave the secret empty to let the container generate one into the volume.
      URLET_SECRET: ${URLET_SECRET:-}
      URLET_ADMIN_EMAIL: ${URLET_ADMIN_EMAIL:-}
      URLET_ADMIN_PASSWORD: ${URLET_ADMIN_PASSWORD:-}
      URLET_REGISTRATION: ${URLET_REGISTRATION:-}
      # Bot protection (Cloudflare Turnstile / Google reCAPTCHA). The defaults
      # are empty on purpose: a non-empty value overrides the settings table, so
      # hard-coding `none`/`false` here would stop the admin panel from ever
      # configuring the feature. Empty means "use the value stored in settings".
      URLET_CAPTCHA_PROVIDER: ${URLET_CAPTCHA_PROVIDER:-}
      URLET_CAPTCHA_SITE_KEY: ${URLET_CAPTCHA_SITE_KEY:-}
      URLET_CAPTCHA_SECRET_KEY: ${URLET_CAPTCHA_SECRET_KEY:-}
      URLET_CAPTCHA_ON_REGISTER: ${URLET_CAPTCHA_ON_REGISTER:-}
      URLET_CAPTCHA_ON_LOGIN: ${URLET_CAPTCHA_ON_LOGIN:-}
      URLET_CAPTCHA_ON_CREATE: ${URLET_CAPTCHA_ON_CREATE:-}
      # Extra hostnames the provider may report back; the host of URLET_BASE_URL
      # is always accepted, so leave this empty unless the instance is served
      # under more than one name.
      URLET_CAPTCHA_ALLOWED_HOSTNAMES: ${URLET_CAPTCHA_ALLOWED_HOSTNAMES:-}
      URLET_SECURE_COOKIES: ${URLET_SECURE_COOKIES:-false}
      URLET_TRUST_PROXY: ${URLET_TRUST_PROXY:-false}
      URLET_SESSION_TTL_HOURS: ${URLET_SESSION_TTL_HOURS:-168}
      URLET_UNLOCK_TTL_MINUTES: ${URLET_UNLOCK_TTL_MINUTES:-30}
      URLET_DEFAULT_SLUG_LENGTH: ${URLET_DEFAULT_SLUG_LENGTH:-}
      URLET_LOG: ${URLET_LOG:-info}
      URLET_LOG_FORMAT: ${URLET_LOG_FORMAT:-compact}

    volumes:
      - urlet-data:/data

    # Hardening: the process only ever writes to /data.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "/usr/local/bin/urlet", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  urlet-data:
    name: urlet-data
