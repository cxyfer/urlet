{% extends "base.html" %}

{% block title %}{{ status_code }} — {{ title }}{% endblock %}

{% block content %}
<div class="status-page">
    <div class="status-card">
        <p class="status-code" aria-hidden="true">{{ status_code }}</p>
        <h1>{{ status_code }} — {{ title }}</h1>
        <p class="status-message">{{ message }}</p>
        <div class="status-actions">
            <a class="btn btn-primary" href="/app">{{ lang.t("error.dashboard") }}</a>
            <a class="btn btn-outline" href="/app/login">{{ lang.t("auth.login.title") }}</a>
        </div>
    </div>
</div>
{% endblock %}
