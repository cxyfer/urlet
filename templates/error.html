{% extends "base.html" %}

{% block title %}{{ status_code }} — {{ title }}{% endblock %}

{% block content %}
<div class="error-page">
    <div class="status-card">
        <span class="status-code">{{ status_code }}</span>
        <span class="status-glyph" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 27V13"></path>
                <path d="M16 17c0-5 3.6-8.6 8.6-8.6 0 5-3.6 8.6-8.6 8.6z"></path>
                <path d="M16 21c0-4-2.9-6.9-6.8-6.9 0 4 2.9 6.9 6.8 6.9z"></path>
                <path d="M8 27h16" opacity=".5"></path>
            </svg>
        </span>
        <h1>{{ status_code }} — {{ title }}</h1>
        <p class="muted">{{ message }}</p>
        <div class="status-actions">
            <a class="btn btn-primary" href="/app">{{ lang.t("error.dashboard") }}</a>
            <a class="btn btn-ghost" href="/app/login">{{ lang.t("auth.login.title") }}</a>
        </div>
    </div>
</div>
{% endblock %}
