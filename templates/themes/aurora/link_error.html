{% extends "themes/aurora/base.html" %}

{% block title %}{{ status_code }} — {{ title }}{% endblock %}

{% block body_class %}page-link{% endblock %}

{% block body %}
<main class="link-page">
    <div class="card link-card">
        <span class="link-glyph" aria-hidden="true">{{ status_code }}</span>
        <h1>{{ title }}</h1>
        <p class="muted">{{ message }}</p>
        <a class="btn btn-primary btn-block" href="/app">{{ lang.t("link.go_to") }} {{ site_name }}</a>
    </div>
</main>
{% endblock %}
