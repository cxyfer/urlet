<!DOCTYPE html>
<html lang="{{ lang.html_lang() }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f0e6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ self.theme_css_url() }}?v={{ self.asset_version() }}">
    <link rel="stylesheet" href="/assets/theme-ui.css?v={{ self.asset_version() }}">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    {% block head %}{% endblock %}
</head>
<body data-theme-key="{{ self.theme_key() }}">
{% block topbar %}{% endblock %}
{% block body %}
<main class="wrap">
    {% block content %}{% endblock %}
</main>
{% endblock %}
<footer class="site">
    <div class="site-inner">
        <div class="site-left">
            <span class="site-mark">{{ site_name }}</span>
            <span class="site-tag">{{ lang.t("footer.tagline") }}</span>
        </div>
        <div class="site-right">
            <span class="site-meta" aria-hidden="true">01<span class="meta-bar"></span>03</span>
            {% block footer_lang %}{% include "partials/lang_switcher.html" %}{% endblock %}
        </div>
    </div>
</footer>
<script src="/assets/app.js?v={{ self.asset_version() }}" defer></script>
</body>
</html>
