{% extends "themes/signal/base.html" %}

{% block title %}{{ status_code }} — {{ title }}{% endblock %}

{% block content %}
<div class="error-shell">
    <div class="error-card">
        <span class="error-code" aria-hidden="true">{{ status_code }}</span>
        <h1>{{ status_code }} — {{ title }}</h1>
        <p>{{ message }}</p>
        <div class="row">
            <a class="btn btn-primary" href="/app">{{ lang.t("error.dashboard") }}</a>
            <a class="btn btn-ghost" href="/app/login">{{ lang.t("auth.login.title") }}</a>
        </div>
    </div>
</div>
{% endblock %}
