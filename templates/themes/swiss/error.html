{% extends "themes/swiss/base.html" %}

{% block title %}{{ status_code }} — {{ title }}{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-code" aria-hidden="true">{{ status_code }}</div>
    <div class="error-body">
        <p class="error-meta" aria-hidden="true">/// — {{ status_code }}</p>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <div class="row mt">
            <a class="btn btn-primary" href="/app">{{ lang.t("error.dashboard") }}</a>
            <a class="btn" href="/app/login">{{ lang.t("auth.login.title") }}</a>
        </div>
    </div>
</div>
{% endblock %}
