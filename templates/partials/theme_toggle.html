{# Theme toggle shared by the headers and the footer. It stays hidden until
   theme.js has applied the stored/system preference, so it is never a dead
   control when JavaScript is unavailable. #}
<button class="theme-toggle" type="button" data-theme-toggle hidden
        aria-label="{{ lang.t("theme.toggle") }}" title="{{ lang.t("theme.toggle") }}">
    <span class="theme-toggle-icon theme-toggle-sun" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.4" stroke-linecap="round">
            <circle cx="8" cy="8" r="3.1"></circle>
            <path d="M8 1.2v1.5M8 13.3v1.5M1.2 8h1.5M13.3 8h1.5M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1"></path>
        </svg>
    </span>
    <span class="theme-toggle-icon theme-toggle-moon" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.2 9.7A5.5 5.5 0 0 1 6.3 2.8 5.5 5.5 0 1 0 13.2 9.7Z"></path>
        </svg>
    </span>
</button>
