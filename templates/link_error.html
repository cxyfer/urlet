{% extends "base.html" %}

{% block title %}{{ status_code }} — {{ title }}{% endblock %}

{% block body %}
<div class="status-shell">
    <div class="link-page">
        <div class="status-card">
            <span class="status-code">{{ status_code }}</span>
            <span class="status-glyph" aria-hidden="true">
                <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 19a5.5 5.5 0 0 0 7.8 0l3.2-3.2a5.5 5.5 0 0 0-7.8-7.8L14.4 9.8"></path>
                    <path d="M19 13a5.5 5.5 0 0 0-7.8 0L8 16.2a5.5 5.5 0 0 0 7.8 7.8l1.8-1.8"></path>
                </svg>
            </span>
            <h1>{{ title }}</h1>
            <p class="muted">{{ message }}</p>
            <div class="status-actions">
                <a class="btn btn-primary" href="/app">{{ lang.t("link.go_to") }} {{ site_name }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
