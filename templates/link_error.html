{% extends "base.html" %}

{% block title %}{{ status_code }} — {{ title }}{% endblock %}

{% block body %}
<div class="link-page">
    <div class="card">
        <h1>{{ title }}</h1>
        <p class="muted">{{ message }}</p>
        <a class="btn btn-block" href="/app">{{ lang.t("link.go_to") }} {{ site_name }}</a>
    </div>
</div>
{% endblock %}
