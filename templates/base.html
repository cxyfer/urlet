<!DOCTYPE html>
<html lang="{{ lang.html_lang() }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <link rel="stylesheet" href="/assets/app.css">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    {% block head %}{% endblock %}
</head>
<body>
{% block topbar %}{% endblock %}
{% block body %}
<main class="wrap">
    {% block content %}{% endblock %}
</main>
{% endblock %}
<footer class="site">
    <div class="footer-brandrow">
        <span class="footer-brand"><span class="footer-dot" aria-hidden="true"></span>{{ site_name }}</span>
        <span class="footer-meta">{{ lang.t("footer.tagline") }}</span>
    </div>
    {% block footer_lang %}{% include "partials/lang_switcher.html" %}{% endblock %}
</footer>
<script src="/assets/app.js" defer></script>
</body>
</html>
