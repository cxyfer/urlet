<!DOCTYPE html>
<html lang="{{ lang.html_lang() }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <link rel="stylesheet" href="/assets/app.css">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    {% block head %}{% endblock %}
</head>
<body>
{% block body %}
<main class="page">
    <div class="page-inner">
        {% block content %}{% endblock %}
    </div>
</main>
{% endblock %}
<footer class="colophon">
    <div class="colophon-inner">
        <p class="colophon-line">
            <span class="colophon-name">{{ site_name }}</span>
            <span class="colophon-rule" aria-hidden="true"></span>
            <span class="colophon-tagline">{{ lang.t("footer.tagline") }}</span>
        </p>
        {% block footer_lang %}{% include "partials/lang_switcher.html" %}{% endblock %}
    </div>
</footer>
<script src="/assets/app.js" defer></script>
</body>
</html>
