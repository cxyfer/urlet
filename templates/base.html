<!DOCTYPE html>
<html lang="{{ lang.html_lang() }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <link rel="stylesheet" href="/assets/app.css">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    {% block head %}{% endblock %}
</head>
<body>
{% block topbar %}{% endblock %}
{% block body %}
<main class="wrap">
    {% block content %}{% endblock %}
</main>
{% endblock %}
<footer class="site">
    <div class="site-inner">
        <span class="footer-mark">{{ site_name }}<span>.</span></span>
        <span class="site-tagline">{{ lang.t("footer.tagline") }}</span>
        <span class="site-index" aria-hidden="true">/// 00 — 06</span>
        {% block footer_lang %}{% include "partials/lang_switcher.html" %}{% endblock %}
    </div>
</footer>
<script src="/assets/app.js" defer></script>
</body>
</html>
