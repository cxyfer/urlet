# uwurls — run the published container image instead of building it locally.
#
# Every `v*` tag publishes a multi-arch image (linux/amd64 + linux/arm64) to
# GHCR. Use this overlay on top of docker-compose.yml:
#
#   export UWURLS_IMAGE=ghcr.io/cxyfer/uwurls:1.1.0   # pin a version in production
#   docker compose -f docker-compose.yml -f docker-compose.image.yml up -d
#
# `build` is reset so compose never falls back to a local build; a missing image
# is pulled from the registry instead. Combine it with the TLS overlay as usual:
#
#   docker compose -f docker-compose.yml -f docker-compose.image.yml \
#                  -f docker-compose.tls.yml up -d

services:
  uwurls:
    image: ${UWURLS_IMAGE:-ghcr.io/cxyfer/uwurls:latest}
    build: !reset null
