<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The site is a static export and every page lives under a locale prefix, so
      the bare root has no page of its own. Next.js does not run middleware in an
      export, so this is a plain document rather than a redirect rule.
    -->
    <meta http-equiv="refresh" content="0; url=./en/" />
    <link rel="canonical" href="./en/" />
    <title>urlet documentation</title>
  </head>
  <body>
    <p><a href="./en/">urlet documentation</a></p>
  </body>
</html>
