name: Release container image

# Publishing a version = pushing a `v*` tag. The workflow then:
#   1. checks the tag matches the version in Cargo.toml,
#   2. builds linux/amd64 and linux/arm64 in parallel, each on a native runner,
#   3. merges the two single-platform digests into one multi-arch manifest and
#      moves X, X.Y and latest only when the tag is the newest stable release.
#
# The GitHub release itself is still published by hand, so its notes are yours.
# Manual runs (workflow_dispatch) rebuild an existing tag; by default they push
# only the exact version, so rebuilding an old tag cannot move `latest` back.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release, e.g. v1.1.0"
        required: true
        type: string
      update_moving_tags:
        description: "Also move the X, X.Y and latest tags to this build"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  # One release at a time across all tags: a slow older build must never finish
  # after a newer one and move the moving tags backwards. `queue: max` keeps up
  # to 100 pending releases instead of replacing the second pending one, so a
  # burst of tags still publishes every exact version.
  group: release-image
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------ validate
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      is_latest: ${{ steps.latest.outputs.is_latest }}
    steps:
      - name: Resolve the release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag such as v1.2.3"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          # All tags are needed to decide whether this release is the newest
          # stable one and may therefore move X, X.Y and latest.
          fetch-depth: 0

      - name: Check that Cargo.toml matches the tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          manifest_version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          expected="${TAG#v}"
          if [[ "$manifest_version" != "$expected" ]]; then
            echo "::error file=Cargo.toml::Cargo.toml declares version '$manifest_version' but the tag is '$TAG'. Bump the version before tagging."
            exit 1
          fi
          echo "Releasing urlet $manifest_version"

      - name: Check that Cargo.lock is current
        run: |
          set -euo pipefail
          # The Dockerfile builds with --locked, so a stale lockfile would fail
          # the image build much later. Catch it here instead.
          cargo metadata --locked --format-version 1 >/dev/null
          echo "Cargo.lock matches Cargo.toml"

      - name: Determine whether this is the newest stable release
        id: latest
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Only stable tags (no -rc/-beta suffix) can move X, X.Y and latest.
          latest=$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1 || true)
          if [[ "$TAG" == "$latest" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is the newest stable release; moving tags will be updated"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is not the newest stable release (newest: ${latest:-none}); only the exact version will be pushed"
          fi

  # --------------------------------------------------------------------- build
  # One job per platform on a native runner. The arm64 half used to run under
  # QEMU on an amd64 runner and dominated the wall clock; a native arm64 runner
  # compiles it at roughly the same speed as amd64.
  build:
    name: Build ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (labels only)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tags are attached to the merged manifest below, not to either
          # single-platform digest.
          flavor: |
            latest=false

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # A separate cache scope per platform: sharing one scope made the two
          # platforms evict each other's layers.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # Push without a tag; the merge job turns the digests into the final
          # manifest list.
          outputs: >-
            type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------- publish
  publish:
    name: Publish the multi-arch manifest
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.tag }},enable=${{ needs.validate.outputs.is_latest == 'true' && (github.event_name == 'push' || inputs.update_moving_tags) }}
            type=semver,pattern={{major}},value=${{ needs.validate.outputs.tag }},enable=${{ needs.validate.outputs.is_latest == 'true' && (github.event_name == 'push' || inputs.update_moving_tags) }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.is_latest == 'true' && (github.event_name == 'push' || inputs.update_moving_tags) }}
          flavor: |
            latest=false

      - name: Create the manifest list
        run: |
          set -euo pipefail
          cd /tmp/digests
          # One file per platform digest; the metadata action supplies the tags.
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $tags \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect the published manifest
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
