name: CI

# Everything a pull request has to pass before it can merge: formatting, lints,
# the test suite, the end-to-end smoke run and the OpenAPI contracts.
#
# The same jobs run on every push to the default branch, with one exception:
# when the push is the merge commit of a pull request whose checks already
# passed, the suite is skipped. The pull request ran it against the merged tree
# and the merge commit keeps that tree, so repeating it adds nothing.
#
# Nothing else is skipped. Direct pushes (release bumps, docs commits), force
# pushes, rebase merges and merges of a pull request that is red or has no
# checks still run in full. The gate is fail-open — see scripts/ci-push-gate.sh.
#
# The commands mirror "Before you call a change done" in AGENTS.md. When a check
# is added or dropped there, update this file too.

on:
  pull_request:
  push:
    branches: [master]

# A new push makes the previous pull request run obsolete, so cancel it. A push
# to the default branch instead gets a group of its own. Sharing one group per
# branch would not be enough: `cancel-in-progress: false` protects only the run
# that is already going, while the next push still replaces the queued run — so
# a second push arriving mid-run would leave the first commit with no CI result.
# (`queue: max` would preserve the queue, but it cannot be combined with the
# conditional `cancel-in-progress` below.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || 'pull-request' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `pull-requests`, `checks` and `statuses` are read by the gate below. They stay
# read-only: this workflow never writes anything back to the repository.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # --------------------------------------------------------------------- gate
  # One cheap job decides whether the four real jobs have to run. On pull
  # requests it always answers "run"; only pushes can answer "false".
  gate:
    name: Decide whether CI is needed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this commit was already tested
        id: decide
        # The four jobs below run on `always()` and skip only on an explicit
        # "false", so a crashed or timed-out gate still runs the suite instead
        # of silently skipping it. A gate failure stays visible as a red job.
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          # The jobs whose work the gate is allowed to skip. The gate verifies
          # that every one of them ran on the pull request and passed, so keep
          # this in step with the `name:` of the four jobs below — a pull
          # request that drops or renames one must not look tested. Adding a job
          # means adding its name here, or a pull request that dropped it would
          # still look tested and the push run would skip a suite that never ran.
          REQUIRED: Formatting, Lints and tests, Smoke test, OpenAPI contracts
        run: bash scripts/ci-push-gate.sh

  # --------------------------------------------------------------- formatting
  # No build is needed, so this job finishes in seconds and fails first.
  fmt:
    name: Formatting
    needs: gate
    if: always() && needs.gate.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check

  # ------------------------------------------------------------------- lints
  # Clippy and the tests share one job on purpose: `cargo test` reuses most of
  # what Clippy already compiled, so separate jobs would build the whole
  # dependency graph twice for no benefit.
  #
  # `--locked` turns a lockfile that was not refreshed alongside Cargo.toml into
  # a clear failure here instead of a surprise in the release build, which
  # compiles with `--locked` too.
  lint-and-test:
    name: Lints and tests
    needs: gate
    if: always() && needs.gate.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy --locked --all-targets -- -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked

  # --------------------------------------------------------- end-to-end smoke
  # scripts/smoke.sh builds the real binary and drives it over HTTP. It needs
  # curl and sqlite3, both of which ship with the GitHub-hosted runner image.
  smoke:
    name: Smoke test
    needs: gate
    if: always() && needs.gate.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: bash scripts/smoke.sh
        run: bash scripts/smoke.sh

  # ------------------------------------------------------- contract freshness
  # The OpenAPI contracts are generated from openapi/ and committed, because
  # `src/assets.rs` embeds them with `include_str!`. Regenerating them here means
  # a contract edit that forgot to run the generator fails CI instead of
  # shipping a reference that disagrees with the source files.
  #
  # `actions/setup-python` is used rather than the runner's system Python: on
  # recent Ubuntu images a bare `pip install` is refused by PEP 668.
  #
  # Like the other three, it hangs off the gate: `always()` and an explicit
  # "false" keep a crashed gate from skipping it, and its name is in the gate's
  # `REQUIRED` list so a pull request cannot drop it and still look tested.
  contracts:
    name: OpenAPI contracts
    needs: gate
    if: always() && needs.gate.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: python3 -m pip install pyyaml
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: python3 scripts/build-openapi.py --check
        run: python3 scripts/build-openapi.py --check
