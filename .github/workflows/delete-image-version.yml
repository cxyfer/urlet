name: Delete a container image version

# GHCR cannot delete a single tag. A package version is a manifest digest, and
# every tag pointing at it disappears with it. This is the cleanup path for a
# version that a rebuild left behind — the bare 1.3.0-rc.1 published before the
# tag-prefix change, for example.
#
# Guard rails:
#   * workflow_dispatch only, so repository write access is required;
#   * the confirmation input must repeat the tag;
#   * a v-prefixed tag is refused;
#   * a version that also carries a v-prefixed tag or `latest` is refused, so the
#     canonical image and the moving tag can never be deleted by accident.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Bare tag whose version should be deleted, e.g. 1.3.0-rc.1"
        required: true
        type: string
      confirm:
        description: "Repeat the tag to confirm"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Check the inputs
        env:
          TAG: ${{ inputs.tag }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$TAG" != "$CONFIRM" ]]; then
            echo "::error::confirm must repeat the tag exactly"
            exit 1
          fi
          if [[ "$TAG" == v* ]]; then
            echo "::error::refusing to touch a v-prefixed tag"
            exit 1
          fi

      - name: Find the package version
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          package="${REPO#*/}"
          # One JSON object per line, so pagination does not get in the way.
          match="$(gh api --paginate \
              "/repos/$REPO/packages/container/$package/versions?per_page=100" \
              --jq '.[]' \
            | jq -r --arg tag "$TAG" '
                select(.metadata.container.tags | index($tag))
                | "\(.id)\t\(.metadata.container.tags | join(","))"
              ')"
          count="$(grep -c . <<< "$match" || true)"
          if [[ "$count" -ne 1 ]]; then
            echo "::error::expected exactly one version tagged $TAG, found $count"
            exit 1
          fi
          id="$(cut -f1 <<< "$match")"
          tags="$(cut -f2 <<< "$match")"
          echo "Version $id carries: $tags"
          if tr ',' '\n' <<< "$tags" | grep -qxE 'v.*|latest'; then
            echo "::error::that version also carries a v-prefixed tag or latest; refusing to delete it"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Delete the version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ steps.find.outputs.id }}
        run: |
          set -euo pipefail
          package="${REPO#*/}"
          gh api -X DELETE "/repos/$REPO/packages/container/$package/versions/$ID"
          echo "Deleted package version $ID"
